<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2G 온라인팀 업무 배분·일정</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#202733;background:#f4f5f7;--line:#d9dee5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:4px;background:#fff;padding:5px 7px;font-size:12px}button{cursor:pointer}button:hover:not(:disabled){background:#e8efff;color:#17449d;border-color:#a8bde8}button.primary{background:#2563eb;border-color:#2563eb;color:white}button.primary:hover:not(:disabled){background:#1d4ed8;color:white}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:2px solid #5186ed;outline-offset:1px}input[type=checkbox]{accent-color:#2563eb}a{color:#1d4ed8}.hide{display:none!important}
.topnav{display:flex;align-items:center;gap:14px;height:37px;padding:3px 12px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:bold;letter-spacing:1px;white-space:nowrap}nav{display:flex;gap:3px;overflow-x:auto;white-space:nowrap;min-width:0}nav button{padding:5px 9px;border-color:transparent;background:transparent}nav button.active{background:#e7eeff;color:#1d459a;border-color:#c3d2ef}main{padding:7px 10px 20px;min-width:0}.controls,.filters,.roster,.period-controls,.controls-right{display:flex;align-items:center;gap:5px}.controls,.filters,.roster{flex-wrap:wrap}.controls{margin-bottom:6px;justify-content:space-between}h1{font-size:14px;margin:0 10px 0 0;white-space:nowrap}#period{font-size:16px;font-weight:bold;min-width:110px;text-align:center}#status{font-size:10px;color:#526174;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}#status.error{color:#b91c1c;font-weight:bold}.filters{margin-bottom:6px}.filters input[type=search]{width:200px}.filters select{max-width:120px}.filters label{display:flex;gap:3px;align-items:center;font-size:11px}.roster{margin-left:6px;gap:4px}.person-filter{border-color:var(--p);background:var(--bg);color:var(--ink);font-weight:bold;padding:4px 8px}.person-filter.active,.person-filter:hover:not(:disabled){background:var(--p);color:#fff;border-color:var(--p)}
.person-0{--p:#2563eb;--bg:#eff6ff;--ink:#1e40af}.person-1{--p:#7c3aed;--bg:#f5f3ff;--ink:#5b21b6}.person-2{--p:#0d9488;--bg:#f0fdfa;--ink:#115e59}.person-3{--p:#c65d09;--bg:#fff7ed;--ink:#9a3412}.person-extra,.person-shared{--p:#64748b;--bg:#f1f5f9;--ink:#334155}.person-unassigned{--p:#c24159;--bg:#fff1f2;--ink:#9f1239}
.calendar-wrap{border:1px solid #cbd2dc;border-radius:3px;overflow:auto;background:white}.calendar-grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));min-width:860px}.calendar-grid.weekend{grid-template-columns:repeat(7,minmax(155px,1fr));min-width:1100px}.weekday{padding:4px;text-align:center;background:#e9ecf1;border-right:1px solid var(--line);font-size:11px;font-weight:bold}.day{border-top:1px solid #c7cfdb;border-right:1px solid var(--line);padding:3px 4px 4px;min-height:78px;min-width:0;background:#fff}.day.outside{background:#f4f5f7}.day.outside .day-date{color:#8a94a3}.day-header{display:flex;align-items:center;justify-content:space-between;gap:3px;height:23px;border-bottom:1px solid #e8ebef;margin-bottom:2px}.day-date{border:0;background:transparent;padding:2px 4px;font-size:12px;font-weight:bold}.today .day-date{background:#2563eb;color:#fff}.day-open{padding:1px 5px;border:0;color:#69778b;font-size:10px}.person-group{margin:3px 0;border-left:3px solid var(--p);padding-left:3px;min-width:0}.person-heading{display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);height:18px;font-size:10px;font-weight:bold;padding:1px 4px}.person-heading button{border:0;background:transparent;padding:0 3px;font-size:11px;color:var(--ink)}.task-line{display:flex;align-items:center;gap:3px;min-height:20px;border-bottom:1px dotted #e3e7ed;padding:1px 0;min-width:0}.task-line:hover,.task-line:focus-within{background:#edf3ff}.task-line input[type=checkbox]{margin:0;flex:none;width:12px;height:12px}.task-title{flex:1;min-width:0;border:0;border-radius:0;text-align:left;background:transparent;padding:2px 1px;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#253041}.task-title:hover:not(:disabled){background:transparent;text-decoration:underline;color:#1d4ed8}.task-line.done .task-title{color:#697586;text-decoration:line-through}.task-line.alert .task-title{color:#b42330}.task-line.leave .task-title::before{content:'휴가·출장 ';color:#9a3412;font-size:9px}.inline-person,.inline-date{display:none;font-size:10px;padding:1px;flex:none}.inline-person{width:59px;max-width:59px}.inline-date{width:22px;min-width:22px;color:transparent}.inline-date::-webkit-calendar-picker-indicator{margin:0;padding:0;cursor:pointer}.task-line:hover .inline-person,.task-line:focus-within .inline-person,.task-line:hover .inline-date,.task-line:focus-within .inline-date{display:block}.task-line[draggable=true]{cursor:grab}.task-line.dragging{opacity:.45}.drop-target{outline:2px dashed #2563eb;outline-offset:-2px;background:#eff6ff!important}.quick-add{display:flex;gap:2px;margin-top:3px;border-top:1px dashed #e1e5eb;padding-top:3px}.quick-add select{width:56px;min-width:56px;padding:2px 1px;font-size:10px}.quick-add input{width:100%;min-width:0;flex:1;padding:3px;font-size:10px;border-color:#e1e5eb}.completed{margin-top:2px;font-size:10px;color:#667387}.completed>summary{cursor:pointer;padding:3px 1px}.completed[open]{border-top:1px solid #dbe1e9}.week-view .task-title{white-space:normal}.week-view .day{min-height:160px}.calendar-hint{font-size:10px;color:#6b7788;margin:4px 1px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:3px}.list-row{display:grid;grid-template-columns:18px 85px 60px minmax(180px,1fr) 90px 100px;gap:7px;align-items:center;min-height:28px;padding:3px 7px;border-bottom:1px solid #e4e8ee;font-size:11px}.list-row .task-title{font-size:11px}.person-label{display:inline-block;font-size:10px;font-weight:bold;color:var(--ink);background:var(--bg);border-left:3px solid var(--p);padding:3px 5px}.list-row select,.list-row input{font-size:10px;padding:2px}.empty{padding:25px;text-align:center;color:#7a8698;font-size:12px}.audit{display:grid;grid-template-columns:50px 140px minmax(130px,1fr) 180px;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px}.settings{max-width:740px;background:#fff;border:1px solid var(--line);padding:16px}.settings h2{font-size:16px;margin-top:0}.member{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:8px 0}.sub{font-size:11px;color:#6b7788;line-height:1.5}
.drawer{display:none;position:fixed;right:0;top:0;bottom:0;width:405px;max-width:95vw;background:#fff;border-left:1px solid #b9c5d5;box-shadow:-4px 0 16px #25304118;z-index:30;padding:14px;overflow:auto}.drawer.show{display:block}.drawer-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}.drawer h2{font-size:16px;margin:0}.drawer-close{border:0;font-size:18px;padding:0 5px}.drawer-open main{margin-right:405px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:4px;font-size:11px}.form input,.form select,.form textarea{width:100%;min-width:0;padding:6px}.full{grid-column:1/-1}.form textarea{min-height:100px}#taskForm footer{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}#delete{color:#b42330;border-color:#f0bec5}#formError{color:#b42330;font-size:11px}.day-panel-group{margin:10px 0}.day-panel-group h3{font-size:12px;margin:0;padding:4px;background:var(--bg);color:var(--ink);border-left:3px solid var(--p)}.day-panel-item{display:flex;gap:6px;border-bottom:1px solid #e7ebf0;padding:6px 1px}.day-panel-item button{text-align:left;background:transparent;border:0;padding:0;font-size:12px;line-height:1.5}.day-panel-item.done button{text-decoration:line-through;color:#738095}.day-panel-item input{margin-top:4px}.day-panel-category{display:block;font-size:10px;color:#6b7788}.drawer .quick-add{margin:8px 0}.drawer .quick-add input{font-size:12px;padding:6px}.drawer .quick-add select{width:70px;font-size:11px}
@media(max-width:900px){.controls{gap:5px}.controls-right #status{max-width:130px}.roster{margin-left:0}.drawer-open main{margin-right:0}.drawer{box-shadow:-6px 0 25px #25304135}.list-row{grid-template-columns:18px 70px 55px minmax(150px,1fr) 75px}.list-row .optional{display:none}}@media(max-width:600px){.topnav{padding:3px 7px;gap:8px;height:35px}nav button{font-size:11px;padding:5px 7px}main{padding:6px}.controls{display:block}.period-controls{margin-bottom:5px}h1{font-size:12px;margin-right:4px}.controls-right{justify-content:flex-end}.filters input[type=search]{width:150px}.filters select{max-width:100px}.roster{width:100%}.drawer{width:380px}.audit{grid-template-columns:45px 100px 1fr}.audit span:last-child{display:none}}
</style>
<div class="topnav"><span class="brand">R2G</span><nav id="nav"><button data-view="month" class="active">월간 배분표</button><button data-view="week">주간 업무</button><button data-view="pending">미완료</button><button data-view="done">완료 기록</button><button data-view="leave">휴가·출장</button><button data-view="history">변경 이력</button><button data-view="settings">팀 설정</button></nav></div>
<main><div class="controls"><div class="period-controls"><h1>온라인팀 업무 배분·일정</h1><button id="prev" aria-label="이전 기간">‹</button><span id="period"></span><button id="next" aria-label="다음 기간">›</button><button id="today">오늘</button></div><div class="controls-right"><span id="status" role="status">공동 데이터 연결 중…</span><button id="refresh">새로고침</button><button id="export">CSV</button><button id="add" class="primary" disabled>+ 업무</button></div></div>
<div class="filters" id="filters"><input type="search" id="search" aria-label="업무 검색" placeholder="업무명·메모 검색"><select id="category" aria-label="업무구분"><option value="">업무구분 전체</option></select><select id="statusFilter" aria-label="상태"><option value="">상태 전체</option><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select><label><input type="checkbox" id="showCompleted">완료 펼치기</label><label><input type="checkbox" id="weekends">주말</label><button id="reset">초기화</button><div class="roster" id="roster" aria-label="담당자 필터"></div></div><div id="content"></div><div class="calendar-hint" id="hint">빈 줄에 입력 후 Enter로 추가 · 업무를 끌어 날짜·담당자 변경 · 업무 클릭 시 오른쪽에서 상세 수정</div></main>
<aside class="drawer" id="drawer" role="complementary" aria-label="업무 상세"><div class="drawer-top"><h2 id="drawerTitle">업무 상세</h2><button class="drawer-close" id="closeDrawer" aria-label="상세 닫기">×</button></div><section id="dayPanel" class="hide"></section><form id="taskForm"><div class="form"><label class="full">업무명<input id="title" required maxlength="500"></label><label>날짜<input type="date" id="date" required></label><label>담당자<select id="person"></select></label><label>업무구분<input id="cat" list="categories"><datalist id="categories"></datalist></label><label>상태<select id="taskStatus"><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select></label><label>일정 유형<select id="kind"><option>업무</option><option>휴가·출장</option></select></label><label>채널<input id="channel" list="channels"><datalist id="channels"><option>공통</option><option>네이버</option><option>쿠팡로켓</option><option>골프존</option><option>자사몰</option><option>SNS</option><option>오프라인</option></datalist></label><label class="full">메모<textarea id="note" maxlength="10000"></textarea></label></div><p id="formError" role="alert"></p><footer><button type="button" id="delete">삭제</button><button type="button" id="cancel">닫기</button><button id="save" class="primary">저장</button></footer></form></aside>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let data={tasks:[],users:[],history:[]},view='month',cursor=new Date(),editing=null,busy=false,loaded=false,personFilter='',focusedDay=null,draggingId=null;
const drafts=new Map(),expandedDays=new Set();
const SOURCE_LINK='https:'+String.fromCharCode(47,47)+'docs.google.com/spreadsheets/d/1XWIJSEfbhZ6SpqNp0S383c8lSvgHKvUi65aS_ndEoMI/edit';
function rpc(name,arg){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script){reject(new Error('공동 편집 웹앱 주소에서 열어 주세요.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg);});}
function message(text,error=false){$('status').textContent=text;$('status').title=text;$('status').classList.toggle('error',error);}
function rosterNames(){const configured=data.users.map(u=>u.name),fallback=['소진','서준','희월','경희'].filter(n=>data.tasks.some(t=>t.assignee===n));return [...new Set([...configured,...fallback])].slice(0,4);}
function allPeople(){return [...new Set([...rosterNames(),...data.tasks.map(t=>t.assignee),'All','미지정'])].filter(Boolean);}
function personClass(name){if(name==='All')return 'person-shared';if(!name||name==='미지정')return 'person-unassigned';const i=rosterNames().indexOf(name);return i<0?'person-extra':'person-'+i;}
function orderedPeople(tasks){const present=[...new Set(tasks.map(t=>t.assignee||'미지정'))],order=[...rosterNames(),'All','미지정'];return present.sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b,'ko');});}
function personOptions(selected){return allPeople().map(p=>`<option ${p===selected?'selected':''}>${esc(p)}</option>`).join('');}
function updateOptions(){const old=$('category').value,cats=[...new Set(['일반','행사','주간 회의','N배송','가격점검','광고 관련','인수인계','연차','출장',...data.tasks.map(t=>t.category)])].sort();$('category').innerHTML='<option value="">업무구분 전체</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(old)?old:'';$('categories').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');const current=$('person').value;$('person').innerHTML=personOptions(current);renderRoster();}
function renderRoster(){$('roster').innerHTML=`<button class="person-filter person-shared ${personFilter===''?'active':''}" data-filter-person="">전체</button>`+[...rosterNames(),'All','미지정'].map(n=>`<button class="person-filter ${personClass(n)} ${personFilter===n?'active':''}" data-filter-person="${esc(n)}">${n==='All'?'공통':esc(n)}</button>`).join('');}
function filtered(){const q=$('search').value.trim().toLowerCase();return data.tasks.filter(t=>(!personFilter||t.assignee===personFilter)&&(!$('category').value||t.category===$('category').value)&&(!$('statusFilter').value||t.status===$('statusFilter').value)&&(!q||[t.title,t.note,t.category,t.channel,t.assignee].join(' ').toLowerCase().includes(q)));}
function monthTasks(){return filtered().filter(t=>t.date.startsWith(iso(cursor).slice(0,7)));}
function calendarDays(date,weekly=false){const y=date.getFullYear(),m=date.getMonth(),start=new Date(y,m,weekly?date.getDate():1);start.setDate(start.getDate()-((start.getDay()+6)%7));const count=weekly?7:Math.ceil((((new Date(y,m,1).getDay()+6)%7)+new Date(y,m+1,0).getDate())/7)*7;return Array.from({length:count},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});}
function taskLine(t){const full=[t.title,t.assignee,t.category,t.status,t.note].filter(Boolean).join(' · ');return `<div class="task-line ${personClass(t.assignee)} ${t.status==='완료'?'done':''} ${t.kind==='휴가·출장'?'leave':''} ${t.status==='확인필요'?'alert':''}" draggable="${!busy}" data-task="${esc(t.id)}"><input type="checkbox" data-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${t.status==='완료'?'checked':''} ${busy?'disabled':''}><button class="task-title" data-edit="${esc(t.id)}" title="${esc(full)}">${esc(t.title)}</button><select class="inline-person" data-person="${esc(t.id)}" aria-label="${esc(t.title)} 담당자 변경" ${busy?'disabled':''}>${personOptions(t.assignee)}</select><input class="inline-date" type="date" data-date="${esc(t.id)}" aria-label="${esc(t.title)} 날짜 변경" value="${t.date}" ${busy?'disabled':''}></div>`;}
function groupLines(tasks,date){return orderedPeople(tasks).map(name=>`<div class="person-group ${personClass(name)}" data-drop-date="${date}" data-drop-person="${esc(name)}"><div class="person-heading"><span>${name==='All'?'공통':esc(name)}</span><button data-quick-person="${esc(name)}" data-quick-date="${date}" aria-label="${date} ${esc(name)} 업무 추가">+</button></div>${tasks.filter(t=>(t.assignee||'미지정')===name).map(taskLine).join('')}</div>`).join('');}
function draftFor(date){if(!drafts.has(date))drafts.set(date,{title:'',assignee:personFilter||data.users.find(u=>u.email===data.user)?.name||rosterNames()[0]||'미지정'});return drafts.get(date);}
function quickForm(date){const d=draftFor(date);return `<form class="quick-add" data-quick="${date}" aria-label="${date} 빠른 업무 추가"><select data-quick-assignee="${date}" aria-label="${date} 빠른 추가 담당자">${personOptions(d.assignee)}</select><input data-quick-title="${date}" aria-label="${date} 빠른 업무명" placeholder="+ 업무 입력 후 Enter" maxlength="500" autocomplete="off" value="${esc(d.title)}" ${loaded?'':'disabled'}></form>`;}
function dayCell(date,list,outside){const day=iso(date),tasks=outside?[]:list.filter(t=>t.date===day),done=tasks.filter(t=>t.status==='완료'),pending=tasks.filter(t=>t.status!=='완료'),all=$('showCompleted').checked||$('statusFilter').value==='완료';return `<section class="day ${outside?'outside':''} ${day===iso(new Date())?'today':''}" data-drop-date="${day}"><div class="day-header"><button class="day-date" data-day="${day}" title="${day} 전체 업무 보기">${date.getMonth()+1}/${date.getDate()}</button>${outside?'':`<button class="day-open" data-day="${day}">상세 ↗</button>`}</div>${outside?'':(all?groupLines(tasks,day):groupLines(pending,day))+(done.length&&!all?`<details class="completed" data-completed="${day}" ${expandedDays.has(day)?'open':''}><summary>완료 ${done.length}건</summary>${groupLines(done,day)}</details>`:'')+quickForm(day)}</section>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderRoster();$('filters').classList.toggle('hide',['settings','history'].includes(view));$('hint').classList.toggle('hide',!['month','week'].includes(view));$('period').textContent=cursor.getFullYear()+'년 '+(cursor.getMonth()+1)+'월';
 if(view==='settings'){renderSettings();return;}if(view==='history'){$('content').innerHTML='<div class="list">'+(data.history.map(h=>`<div class="audit"><span>${esc(h[2])}</span><span>${esc(h[0])}</span><span>${esc(h[4])}</span><span>${esc(h[1])}</span></div>`).join('')||'<div class="empty">변경 기록이 없습니다.</div>')+'</div>';return;}
 const list=filtered();if(['month','week'].includes(view)){const weekly=view==='week',days=calendarDays(cursor,weekly),weekends=$('weekends').checked;if(weekly)$('period').textContent=iso(days[0])+' 주간';$('content').innerHTML=`<div class="calendar-wrap ${weekly?'week-view':''}"><div class="calendar-grid ${weekends?'weekend':''}">`+['월','화','수','목','금',...(weekends?['토','일']:[])].map(x=>`<div class="weekday">${x}</div>`).join('')+days.filter(d=>weekends||![0,6].includes(d.getDay())).map(d=>dayCell(d,list,!weekly&&d.getMonth()!==cursor.getMonth())).join('')+'</div></div>';
 }else{const items=monthTasks().filter(t=>view==='pending'?t.status!=='완료':view==='done'?t.status==='완료':t.kind==='휴가·출장').sort((a,b)=>a.date.localeCompare(b.date)||a.assignee.localeCompare(b.assignee,'ko'));$('content').innerHTML='<div class="list">'+(items.map(t=>`<div class="list-row"><input type="checkbox" data-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${t.status==='완료'?'checked':''} ${busy?'disabled':''}><input type="date" data-date="${esc(t.id)}" aria-label="${esc(t.title)} 날짜 변경" value="${t.date}" ${busy?'disabled':''}><span class="person-label ${personClass(t.assignee)}">${t.assignee==='All'?'공통':esc(t.assignee)}</span><button class="task-title" data-edit="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}</button><select data-person="${esc(t.id)}" aria-label="${esc(t.title)} 담당자 변경" ${busy?'disabled':''}>${personOptions(t.assignee)}</select><span class="optional">${esc(t.category)}</span></div>`).join('')||'<div class="empty">조건에 맞는 업무가 없습니다.</div>')+'</div>';}}
function showDrawer(){$('drawer').classList.add('show');document.body.classList.add('drawer-open');}
function closeDrawer(){if(busy)return;$('drawer').classList.remove('show');document.body.classList.remove('drawer-open');editing=null;focusedDay=null;}
function openTask(id,date,assignee){editing=id?data.tasks.find(t=>t.id===id):null;focusedDay=null;const t=editing||{title:'',date:date||iso(new Date()),assignee:assignee||personFilter||data.users.find(u=>u.email===data.user)?.name||'미지정',category:'일반',status:'예정',channel:'공통',note:'',kind:'업무'};$('person').innerHTML=personOptions(t.assignee);for(const[field,key]of Object.entries({title:'title',date:'date',person:'assignee',cat:'category',taskStatus:'status',channel:'channel',note:'note',kind:'kind'}))$(field).value=t[key]||'';$('drawerTitle').textContent=editing?'업무 수정':'업무 추가';$('dayPanel').classList.add('hide');$('taskForm').classList.remove('hide');$('delete').classList.toggle('hide',!editing);$('delete').textContent='삭제';$('delete').dataset.confirm='';$('formError').textContent='';showDrawer();$('title').focus();}
function openDay(date){focusedDay=date;editing=null;$('drawerTitle').textContent=date+' 전체 업무';$('taskForm').classList.add('hide');$('dayPanel').classList.remove('hide');const tasks=filtered().filter(t=>t.date===date);$('dayPanel').innerHTML=quickForm(date)+(orderedPeople(tasks).map(name=>`<section class="day-panel-group ${personClass(name)}"><h3>${name==='All'?'공통':esc(name)}</h3>${tasks.filter(t=>(t.assignee||'미지정')===name).map(t=>`<div class="day-panel-item ${t.status==='완료'?'done':''}"><input type="checkbox" data-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${t.status==='완료'?'checked':''}><button data-edit="${esc(t.id)}">${esc(t.title)}<span class="day-panel-category">${esc(t.category)} · ${esc(t.status)}${t.note?' · '+esc(t.note):''}</span></button></div>`).join('')}</section>`).join('')||'<p class="sub">등록된 업무가 없습니다.</p>');showDrawer();}
function editingInGrid(){const active=document.activeElement;return active&&$('content').contains(active)&&['INPUT','SELECT'].includes(active.tagName);}
async function refresh(silent=false){if(busy||$('drawer').classList.contains('show')||editingInGrid())return;try{if(!silent)message('공동 데이터 불러오는 중…');data=await rpc('bootstrap');loaded=true;$('add').disabled=false;updateOptions();render();message('공동 저장 연결 · '+new Date().toLocaleTimeString('ko-KR'));}catch(e){message(e.message||String(e),true);}}
async function persist(t){if(busy)throw new Error('앞선 업무 저장을 마친 뒤 다시 입력해 주세요.');busy=true;$('save').disabled=true;$('delete').disabled=true;message('공동 저장 중…');try{const saved=await rpc('mutateTask',t);data.tasks=data.tasks.filter(x=>x.id!==saved.id);if(!saved.deleted)data.tasks.push(saved);updateOptions();message('공동 저장 완료');return saved;}catch(e){message(e.message,true);$('formError').textContent=e.message;throw e;}finally{busy=false;$('save').disabled=false;$('delete').disabled=false;render();if(focusedDay)openDay(focusedDay);}}
async function quickSubmit(form){const date=form.dataset.quick,title=form.querySelector('input').value.trim(),assignee=form.querySelector('select').value;if(!title)return;const d=draftFor(date);d.title=title;d.assignee=assignee;try{await persist({title,date,assignee,category:'일반',status:'예정',channel:'공통',note:'',kind:'업무'});if(d.title===title)d.title='';render();if(focusedDay)openDay(focusedDay);const parent=focusedDay?$('dayPanel'):$('content');parent.querySelector(`[data-quick-title="${date}"]`)?.focus();}catch(e){message(e.message,true);}}
async function changeTask(id,patch){const t=data.tasks.find(t=>t.id===id);if(!t)return;try{await persist({...t,...patch});}catch(e){render();}}
function handleClick(e){const target=e.target.closest('[data-edit],[data-day],[data-quick-person]');if(!target)return;if(target.dataset.edit)openTask(target.dataset.edit);else if(target.dataset.day)openDay(target.dataset.day);else{const date=target.dataset.quickDate;draftFor(date).assignee=target.dataset.quickPerson;const form=$('content').querySelector(`[data-quick="${date}"]`);form.querySelector('select').value=target.dataset.quickPerson;form.querySelector('input').focus();}}
function handleChange(e){if(e.target.dataset.check)changeTask(e.target.dataset.check,{status:e.target.checked?'완료':'예정'});else if(e.target.dataset.person)changeTask(e.target.dataset.person,{assignee:e.target.value});else if(e.target.dataset.date&&e.target.value)changeTask(e.target.dataset.date,{date:e.target.value});else if(e.target.dataset.quickAssignee)draftFor(e.target.dataset.quickAssignee).assignee=e.target.value;}
[$('content'),$('dayPanel')].forEach(root=>{root.addEventListener('click',handleClick);root.addEventListener('change',handleChange);root.addEventListener('input',e=>{if(e.target.dataset.quickTitle)draftFor(e.target.dataset.quickTitle).title=e.target.value;});root.addEventListener('submit',e=>{if(e.target.matches('[data-quick]')){e.preventDefault();quickSubmit(e.target);}});});
$('content').addEventListener('toggle',e=>{if(e.target.dataset.completed){if(e.target.open)expandedDays.add(e.target.dataset.completed);else expandedDays.delete(e.target.dataset.completed);}},true);
$('content').addEventListener('dragstart',e=>{const row=e.target.closest('[data-task]');if(!row||busy)return;draggingId=row.dataset.task;e.dataTransfer.setData('text/plain',draggingId);e.dataTransfer.effectAllowed='move';row.classList.add('dragging');});
$('content').addEventListener('dragover',e=>{const zone=e.target.closest('[data-drop-date]');if(!zone||!draggingId)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));zone.classList.add('drop-target');});
$('content').addEventListener('drop',e=>{const zone=e.target.closest('[data-drop-date]');if(!zone||!draggingId)return;e.preventDefault();const id=draggingId,patch={date:zone.dataset.dropDate};if(zone.dataset.dropPerson)patch.assignee=zone.dataset.dropPerson;draggingId=null;document.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));changeTask(id,patch);});
$('content').addEventListener('dragend',()=>{draggingId=null;document.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));});
$('taskForm').onsubmit=async e=>{e.preventDefault();try{await persist({...editing,title:$('title').value.trim(),date:$('date').value,assignee:$('person').value,category:$('cat').value.trim()||'일반',status:$('taskStatus').value,channel:$('channel').value.trim()||'공통',note:$('note').value,kind:$('kind').value});closeDrawer();}catch(e){}};
$('delete').onclick=async()=>{if(!editing)return;if($('delete').dataset.confirm!=='yes'){$('delete').dataset.confirm='yes';$('delete').textContent='삭제 확정';$('formError').textContent='삭제 확정을 누르면 삭제됩니다. 변경 이력은 남습니다.';return;}try{await persist({...editing,deleted:true});closeDrawer();}catch(e){}};
$('closeDrawer').onclick=closeDrawer;$('cancel').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});$('add').onclick=()=>openTask();$('refresh').onclick=()=>refresh();$('nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b){closeDrawer();view=b.dataset.view;render();}};
$('roster').onclick=e=>{const b=e.target.closest('[data-filter-person]');if(b){personFilter=b.dataset.filterPerson;render();}};
['search','category','statusFilter','weekends','showCompleted'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=()=>{personFilter='';['search','category','statusFilter'].forEach(id=>$(id).value='');$('showCompleted').checked=false;render();};
function move(n){closeDrawer();if(view==='week')cursor.setDate(cursor.getDate()-((cursor.getDay()+6)%7)+7*n);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render();}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{closeDrawer();cursor=new Date();render();};
$('export').onclick=()=>{const safe=s=>'"'+String(s??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['날짜','담당자','업무구분','업무명','상태','채널','메모'],...monthTasks().map(t=>[t.date,t.assignee,t.category,t.title,t.status,t.channel,t.note])],url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='R2G-'+iso(cursor).slice(0,7)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function renderSettings(){$('content').innerHTML=`<section class="settings"><h2>팀 설정</h2><p class="sub">담당자 이름과 Google 로그인 계정을 등록합니다. 네 명이 같은 업무를 수정할 수 있습니다.</p>${data.admin?`<form id="members">${Array.from({length:4},(_,i)=>`<div class="member"><input name="name${i}" aria-label="팀원 ${i+1} 이름" placeholder="이름" required value="${esc(data.users[i]?.name||'')}"><input type="email" name="email${i}" aria-label="팀원 ${i+1} 이메일" placeholder="Google 이메일" required value="${esc(data.users[i]?.email||'')}"></div>`).join('')}<button class="primary">네 명 저장 및 접근 권한 설정</button></form>`:data.users.map(u=>`<p>${esc(u.name)} · ${esc(u.email)}</p>`).join('')}<hr><p class="sub">공동 저장 · 수정 충돌 감지 · 15초 자동 새로고침</p><p><a href="${esc(data.dbUrl||'#')}" target="_blank" rel="noopener">공동 데이터 시트</a> · <a href="${SOURCE_LINK}" target="_blank" rel="noopener">원본 업무 시트</a></p><p class="sub">기존 시트는 보존되며, 앱의 변경은 공동 데이터에 저장됩니다.</p></section>`;if(data.admin)$('members').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),users=Array.from({length:4},(_,i)=>({name:f.get('name'+i),email:f.get('email'+i)}));try{message('팀 접근 권한 설정 중…');await rpc('saveMembers',users);await refresh();}catch(err){message(err.message,true);}};}
render();refresh();setInterval(()=>{if(loaded&&!busy&&!document.hidden)refresh(true);},15000);
</script></html>
