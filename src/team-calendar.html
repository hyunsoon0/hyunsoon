.calendar-wrap{border:1px solid #cbd2dc;border-radius:3px;overflow:auto;background:white}.calendar-grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));min-width:860px}.calendar-grid.weekend{grid-template-columns:repeat(7,minmax(155px,1fr));min-width:1100px}.weekday{padding:4px;text-align:center;background:#e9ecf1;border-right:1px solid var(--line);font-size:11px;font-weight:bold}.day{border-top:1px solid #c7cfdb;border-right:1px solid var(--line);padding:3px 4px 4px;min-height:78px;min-width:0;background:#fff}.day.outside{background:#f4f5f7}.day.outside .day-date{color:#8a94a3}.day-header{display:flex;align-items:center;justify-content:space-between;gap:3px;height:23px;border-bottom:1px solid #e8ebef;margin-bottom:2px}.day-date{border:0;background:transparent;padding:2px 4px;font-size:12px;font-weight:bold}.today .day-date{background:#2563eb;color:#fff}.day-open{padding:1px 5px;border:0;color:#69778b;font-size:10px}.person-group{margin:3px 0;border-left:3px solid var(--p);padding-left:3px;min-width:0}.person-heading{display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);height:18px;font-size:10px;font-weight:bold;padding:1px 4px}.person-heading button{border:0;background:transparent;padding:0 3px;font-size:11px;color:var(--ink)}.task-line{display:flex;align-items:center;gap:3px;min-height:20px;border-bottom:1px dotted #e3e7ed;padding:1px 0;min-width:0}.task-line:hover,.task-line:focus-within{background:#edf3ff}.task-line input[type=checkbox]{margin:0;flex:none;width:12px;height:12px}.task-title{flex:1;min-width:0;border:0;border-radius:0;text-align:left;background:transparent;padding:2px 1px;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#253041}.task-title:hover:not(:disabled){background:transparent;text-decoration:underline;color:#1d4ed8}.task-line.done .task-title{color:#697586;text-decoration:line-through}.task-line.alert .task-title{color:#b42330}.task-line.leave .task-title::before{content:'휴가·출장 ';color:#9a3412;font-size:9px}.inline-person,.inline-date{display:none;font-size:10px;padding:1px;flex:none}.inline-person{width:59px;max-width:59px}.inline-date{width:22px;min-width:22px;color:transparent}.inline-date::-webkit-calendar-picker-indicator{margin:0;padding:0;cursor:pointer}.task-line:hover .inline-person,.task-line:focus-within .inline-person,.task-line:hover .inline-date,.task-line:focus-within .inline-date{display:block}.task-line[draggable=true]{cursor:grab}.task-line.dragging{opacity:.45}.drop-target{outline:2px dashed #2563eb;outline-offset:-2px;background:#eff6ff!important}.quick-add{display:flex;gap:2px;margin-top:3px;border-top:1px dashed #e1e5eb;padding-top:3px}.quick-add select{width:56px;min-width:56px;padding:2px 1px;font-size:10px}.quick-add input{width:100%;min-width:0;flex:1;padding:3px;font-size:10px;border-color:#e1e5eb}.completed{margin-top:2px;font-size:10px;color:#667387}.completed>summary{cursor:pointer;padding:3px 1px}.completed[open]{border-top:1px solid #dbe1e9}.week-view .task-title{white-space:normal}.week-view .day{min-height:160px}.calendar-hint{font-size:10px;color:#6b7788;margin:4px 1px 0}

.person-filter.active,.person-filter:hover:not(:disabled){color:var(--on,#fff)}.person-inactive{--p:#94a3b8;--bg:#f1f3f6;--ink:#6b7280;--on:#111827}.assignee-settings{max-width:960px}.profile-toolbar,.settings-actions{display:flex;align-items:center;gap:10px;margin:10px 0}.profile-toolbar label{display:flex;gap:5px;align-items:center;font-size:11px}.profile-head,.profile-row{display:grid;grid-template-columns:38px minmax(100px,1fr) minmax(120px,1fr) 90px 90px;gap:9px;align-items:center;padding:7px 5px;border-bottom:1px solid var(--line)}.profile-head{background:#f0f2f5;font-size:11px;color:#64748b}.profile-row input{min-width:0;width:100%}.profile-order{font-size:12px;text-align:center;color:#64748b}.profile-color-field{display:flex;gap:8px;align-items:center}.profile-row input[type=color]{width:38px;height:28px;padding:2px;flex:none}.profile-preview{font-size:11px;padding:4px 8px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-active{font-size:11px;display:flex;gap:5px;align-items:center}.profile-row input[type=checkbox]{width:auto}.profile-move{display:flex;gap:5px}.profile-move button{padding:4px 9px}.archived-profile{background:#f6f7f9}.account-settings{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.account-settings summary{font-size:12px;cursor:pointer}.account-row{display:grid;grid-template-columns:100px 1fr 50px;gap:7px;margin:7px 0}#profileError{font-size:12px;color:#b91c1c}.settings-actions{justify-content:flex-end}@media(max-width:650px){.profile-head,.profile-row{grid-template-columns:22px minmax(70px,1fr) 70px 65px 65px;gap:4px}.profile-preview{display:none}.profile-move button{padding:4px 7px}.account-row{grid-template-columns:70px 1fr 45px}}

<div class="topnav"><span class="brand">R2G</span><nav id="nav"><button data-view="month" class="active">월간 배분표</button><button data-view="week">주간 업무</button><button data-view="pending">미완료</button><button data-view="done">완료 기록</button><button data-view="leave">휴가·출장</button><button data-view="history">변경 이력</button><button data-view="settings">팀 설정</button></nav></div>
<main><div class="controls"><div class="period-controls"><h1>온라인팀 업무 배분·일정</h1><button id="prev" aria-label="이전 기간">‹</button><span id="period"></span><button id="next" aria-label="다음 기간">›</button><button id="today">오늘</button></div><div class="controls-right"><span id="status" role="status">공동 데이터 연결 중…</span><button id="refresh">새로고침</button><button id="export">CSV</button><button id="add" class="primary" disabled>+ 업무</button></div></div>
<div class="filters" id="filters"><input type="search" id="search" aria-label="업무 검색" placeholder="업무명·메모 검색"><select id="category" aria-label="업무구분"><option value="">업무구분 전체</option></select><select id="statusFilter" aria-label="상태"><option value="">상태 전체</option><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select><label><input type="checkbox" id="showCompleted">완료 펼치기</label><label><input type="checkbox" id="weekends">주말</label><label><input type="checkbox" id="includeInactive">비활성 포함</label><select id="archivedPerson" class="hide" aria-label="이전 담당자"><option value="">이전 담당자</option></select><button id="reset">초기화</button><div class="roster" id="roster" aria-label="담당자 필터"></div></div><div id="content"></div><div class="calendar-hint" id="hint">빈 줄에 입력 후 Enter로 추가 · 업무를 끌어 날짜·담당자 변경 · 업무 클릭 시 오른쪽에서 상세 수정</div></main>
<aside class="drawer" id="drawer" role="complementary" aria-label="업무 상세"><div class="drawer-top"><h2 id="drawerTitle">업무 상세</h2><button class="drawer-close" id="closeDrawer" aria-label="상세 닫기">×</button></div><section id="dayPanel" class="hide"></section><form id="taskForm"><div class="form"><label class="full">업무명<input id="title" required maxlength="500"></label><label>날짜<input type="date" id="date" required></label><label>담당자<select id="person"></select></label><label>업무구분<select id="cat"></select></label><label>상태<select id="taskStatus"><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select></label><label>일정 유형<select id="kind"><option>업무</option><option>휴가·출장</option></select></label><label>채널<input id="channel" list="channels"><datalist id="channels"><option>공통</option><option>네이버</option><option>쿠팡로켓</option><option>골프존</option><option>자사몰</option><option>SNS</option><option>오프라인</option></datalist></label><label class="full">메모<textarea id="note" maxlength="10000"></textarea></label></div><p id="formError" role="alert"></p><footer><button type="button" id="delete">삭제</button><button type="button" id="cancel">닫기</button><button id="save" class="primary">저장</button></footer></form></aside>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let data={tasks:[],users:[],history:[]},view='month',cursor=new Date(),editing=null,busy=false,loaded=false,personFilter='',focusedDay=null,draggingId=null;
const drafts=new Map(),expandedDays=new Set();
const SOURCE_LINK='https:'+String.fromCharCode(47,47)+'docs.google.com/spreadsheets/d/1XWIJSEfbhZ6SpqNp0S383c8lSvgHKvUi65aS_ndEoMI/edit';
function rpc(name,arg){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script){reject(new Error('공동 편집 웹앱 주소에서 열어 주세요.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg);});}
function message(text,error=false){$('status').textContent=text;$('status').title=text;$('status').classList.toggle('error',error);}
function profiles(){return data.assignees||[];}
function profileFor(name){return profiles().find(p=>p.name===name||(p.aliases||[]).includes(name));}
function personName(name){const p=profileFor(name);return p?p.name:name;}
function inactive(name){return profileFor(name)?.active===false;}
function personLabel(name){return (name==='All'?'공통':name)+(inactive(name)?' · 비활성':'');}
function colorParts(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));}
function onColor(hex){const linear=colorParts(hex).map(x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4);}),l=.2126*linear[0]+.7152*linear[1]+.0722*linear[2];return l>.179?'#111827':'#ffffff';}
function applyPersonColors(){let style=$('assigneeColors');if(!style){style=document.createElement('style');style.id='assigneeColors';document.head.appendChild(style);}style.textContent=profiles().map(p=>{const rgb=colorParts(p.color),bg='rgb('+rgb.map(v=>Math.round(v*.1+255*.9)).join(',')+')',ink='rgb('+rgb.map(v=>Math.round(v*.55)).join(',')+')';return '.assignee-'+p.id+'{--p:'+p.color+';--bg:'+bg+';--ink:'+ink+';--on:'+onColor(p.color)+'}';}).join('');}
function rosterNames(){return profiles().filter(p=>p.active).map(p=>p.name);}
function allPeople(){return [...rosterNames(),'All','미지정'];}
function personClass(name){if(name==='All')return 'person-shared';if(!name||name==='미지정')return 'person-unassigned';const p=profileFor(name);return p?'assignee-'+p.id+(p.active?'':' person-inactive'):'person-extra';}
function orderedPeople(tasks){const present=[...new Set(tasks.map(t=>t.assignee||'미지정'))],order=[...profiles().map(p=>p.name),'All','미지정'];return present.sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'ko');});}
function personOptions(selected){const values=allPeople();if(selected&&!values.includes(selected))values.push(selected);return values.map(name=>'<option value="'+esc(name)+'" '+(name===selected?'selected':'')+'>'+esc(name)+(inactive(name)?' · 비활성':'')+'</option>').join('').replace(/<option /g,'<option ');}

function updateOptions(){applyPersonColors();const old=$('category').value,cats=data.categories||["월간계획","신제품출시","휴무설정","디자인요청","행사·프로모션","광고운영","콘텐츠제작","인플루언서·제휴","리뷰·고객관리","상품·채널운영","발주·재고·물류","사은품·패키지","매출·실적분석","비용·정산","회의·보고","채용·인수인계","제품개선·품질","계약·권리관리","휴가·출장","기타업무"];$('category').innerHTML='<option value="">업무구분 전체</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(old)?old:'';$('cat').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');const current=$('person').value;$('person').innerHTML=personOptions(current);renderRoster();}
function renderRoster(){$('roster').innerHTML='<button class="person-filter person-shared '+(personFilter===''?'active':'')+'" data-filter-person="">전체</button>'+[...rosterNames(),'All','미지정'].map(n=>'<button class="person-filter '+personClass(n)+' '+(personFilter===n?'active':'')+'" data-filter-person="'+esc(n)+'">'+esc(personLabel(n))+'</button>').join('');const historical=$('archivedPerson'),old=historical.value;historical.innerHTML='<option value="">이전 담당자</option>'+profiles().filter(p=>!p.active).map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>').join('');historical.value=personFilter&&inactive(personFilter)?personFilter:'';historical.classList.toggle('hide',!profiles().some(p=>!p.active));}
function filtered(){const q=$('search').value.trim().toLowerCase();return data.tasks.filter(t=>(!inactive(t.assignee)||$('includeInactive').checked||view==='done'||!!personFilter)&&(!personFilter||t.assignee===personFilter)&&(!$('category').value||t.category===$('category').value)&&(!$('statusFilter').value||t.status===$('statusFilter').value)&&(!q||[t.title,t.note,t.category,t.channel,t.assignee].join(' ').toLowerCase().includes(q)));}

function monthTasks(){return filtered().filter(t=>t.date.startsWith(iso(cursor).slice(0,7)));}
function calendarDays(date,weekly=false){const y=date.getFullYear(),m=date.getMonth(),start=new Date(y,m,weekly?date.getDate():1);start.setDate(start.getDate()-((start.getDay()+6)%7));const count=weekly?7:Math.ceil((((new Date(y,m,1).getDay()+6)%7)+new Date(y,m+1,0).getDate())/7)*7;return Array.from({length:count},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});}
function taskLine(t){const full=[t.title,t.assignee,t.category,t.status,t.note].filter(Boolean).join(' · ');return `<div class="task-line ${personClass(t.assignee)} ${t.status==='완료'?'done':''} ${t.kind==='휴가·출장'?'leave':''} ${t.status==='확인필요'?'alert':''}" draggable="${!busy}" data-task="${esc(t.id)}"><input type="checkbox" data-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${t.status==='완료'?'checked':''} ${busy?'disabled':''}><button class="task-title" data-edit="${esc(t.id)}" title="${esc(full)}">${esc(t.title)}</button><select class="inline-person" data-person="${esc(t.id)}" aria-label="${esc(t.title)} 담당자 변경" ${busy?'disabled':''}>${personOptions(t.assignee)}</select><input class="inline-date" type="date" data-date="${esc(t.id)}" aria-label="${esc(t.title)} 날짜 변경" value="${t.date}" ${busy?'disabled':''}></div>`;}

$('addProfile').onclick=()=>{syncProfileDraft();profileDraft.push({id:'person-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),name:'새 담당자',color:['#2563eb','#7c3aed','#0d9488','#c65d09','#db2777','#0891b2'][profileDraft.length%6],active:true,aliases:[]});profileDirty=true;redrawProfileRows();$('profileRows').querySelector('.profile-row:last-child [data-profile-name]')?.focus();};
$('cancelProfiles').onclick=()=>{profileDirty=false;renderSettings();};
$('profilesForm').onsubmit=async e=>{e.preventDefault();syncProfileDraft();$('saveProfiles').disabled=true;$('profileError').textContent='';try{const result=await rpc('saveAssignees',{version:profileDraftVersion,items:profileDraft});data.assignees=result.items;data.assigneeVersion=result.version;data.tasks=data.tasks.map(t=>{const p=profiles().find(p=>p.id===t.assigneeId)||profileFor(t.assignee);return p?{...t,assignee:p.name,assigneeId:p.id,assigneeActive:p.active}:t;});normalizeDrafts();profileDirty=false;updateOptions();renderSettings();message('담당자 설정 공동 저장 완료');}catch(err){$('profileError').textContent=err.message;message(err.message,true);$('saveProfiles').disabled=false;}};
$('accountRows').oninput=()=>{accountDirty=true;syncAccountDraft();};$('accountRows').onclick=e=>{const b=e.target.closest('[data-remove-account]');if(b){syncAccountDraft();accountDraft.splice(Number(b.dataset.removeAccount),1);accountDirty=true;$('accountRows').innerHTML=accountRowsHtml();}};
$('addAccount').onclick=()=>{syncAccountDraft();accountDraft.push({name:'',email:''});accountDirty=true;$('accountRows').innerHTML=accountRowsHtml();};
$('accountsForm').onsubmit=async e=>{e.preventDefault();syncAccountDraft();try{await rpc('saveMembers',accountDraft);data.users=accountDraft.map(u=>({...u}));accountDirty=false;renderSettings();message('접속 계정 저장 완료');}catch(err){message(err.message,true);}};
}

render();refresh();setInterval(()=>{if(loaded&&!busy&&!document.hidden)refresh(true);},15000);
</script></html>
