<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2G 온라인팀 업무캘린더</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#202d32;background:#f4f6f5;--green:#1d6953;--line:#dce5df}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button,input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:white;color:inherit}button:hover{background:#e9f1eb}.primary{background:var(--green);color:white}.layout{display:flex;min-height:100vh}aside{width:210px;background:#153b30;color:#eaf2ee;padding:28px 18px;flex-shrink:0}aside h2{font-size:26px;letter-spacing:3px;margin:0}aside p{font-size:12px;color:#adc4b9;margin-bottom:34px}nav{display:grid;gap:7px}nav button{border:0;text-align:left;background:transparent;color:inherit;padding:12px}nav button.active{background:#31594b;color:white}.aside-foot{font-size:12px;color:#adc4b9;margin-top:40px;line-height:1.8}main{padding:28px;min-width:0;flex:1}header{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:25px;margin:5px 0 8px}header p,.sub{font-size:12px;color:#718077}.eyebrow{font-size:11px;color:var(--green);font-weight:bold;letter-spacing:2px}.actions,.toolbar,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{padding:17px;background:white;border:1px solid var(--line);border-radius:12px;font-size:12px;color:#66796d}.stat b{display:block;color:#233d30;font-size:27px;margin-top:7px}.toolbar{justify-content:space-between;margin:20px 0 12px}.toolbar h2{font-size:20px;margin:0 12px}.filters{margin-bottom:16px}.filters input{flex:1;min-width:160px}.calendar-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}.cal{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));min-width:850px}.cal.weekend{grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}.weekday{text-align:center;padding:12px;background:#eaf0eb;font-size:12px;font-weight:bold}.day{border-top:1px solid var(--line);border-right:1px solid var(--line);padding:9px;min-height:190px}.date{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:bold;font-size:13px}.date button{border:0;padding:2px 7px;color:#73877a}.today .date>span{background:var(--green);color:white;padding:5px 8px;border-radius:6px}.outside{background:#fafbfa;color:#8a9b90}.task{border-left:3px solid #8aab97;background:#f0f5f1;border-radius:5px;padding:7px;margin:5px 0;font-size:12px;display:flex;gap:6px;align-items:flex-start}.task input{margin:2px 0;padding:0;flex:none}.task button{border:0;background:transparent;text-align:left;padding:0;line-height:1.5;width:100%;overflow-wrap:anywhere}.task small{display:block;color:#687f70;font-size:10px}.task.done button{text-decoration:line-through;opacity:.55}.task.leave{background:#fff1dc;border-color:#d7a355}.task.alert{border-color:#cc795c}.list{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:30px 100px 1fr 90px 100px 90px;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px;font-size:12px}.row button{text-align:left;border:0;padding:0;background:transparent}.badge{border-radius:20px;background:#eaf1ec;padding:5px 10px;font-size:11px}.empty{padding:50px;text-align:center;color:#718077}.status{padding:10px 14px;background:#e7efe9;border-radius:8px;font-size:12px;margin-top:12px}.error{background:#fff0e9;color:#a34426}.modal-bg{position:fixed;inset:0;background:#12382b77;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal-bg.show{display:flex}.modal{background:white;border-radius:16px;padding:24px;width:580px;max-width:100%;max-height:90vh;overflow:auto}.modal h2{font-size:20px;margin:0 0 20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-size:12px}.full{grid-column:1/-1}textarea{min-height:100px}.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.settings{max-width:740px;padding:25px;background:white;border:1px solid var(--line);border-radius:12px}.member{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:10px 0}a{color:var(--green)}#fatal{padding:35px;line-height:1.8}.hide{display:none!important}@media(max-width:850px){aside{width:165px;padding:20px 12px}main{padding:16px}.stats{gap:6px}.stat{padding:12px}.row{grid-template-columns:24px 70px 1fr 70px}.row .optional{display:none}}@media(max-width:600px){.layout{display:block}aside{width:auto;padding:14px}aside h2{font-size:20px}aside p,.aside-foot{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap;padding:8px}header{align-items:flex-start}h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.member{grid-template-columns:80px 1fr}}
</style>
<div class="layout"><aside><h2>R2G</h2><p>ONLINE TEAM WORKSPACE</p><nav id="nav"><button data-view="month" class="active">▦ 월간 캘린더</button><button data-view="week">▤ 주간 업무</button><button data-view="pending">◷ 미완료 업무</button><button data-view="done">✓ 완료 기록</button><button data-view="leave">☀ 휴가·출장</button><button data-view="history">↻ 변경 이력</button><button data-view="settings">⚙ 팀 설정</button></nav><div class="aside-foot">팀의 일정을 한곳에서.<br>모든 변경은 공동 저장됩니다.<hr><span id="who"></span></div></aside>
<main><header><div><div class="eyebrow">TEAM CALENDAR</div><h1>온라인팀 업무캘린더</h1><p>매일의 운영부터 다음 프로젝트까지, 함께 확인하세요.</p></div><div class="actions"><button id="refresh">↻ 새로고침</button><button id="add" class="primary" disabled>+ 업무 추가</button></div></header><div id="status" class="status" role="status">Google 계정과 공동 데이터를 확인하고 있습니다…</div>
<section class="stats" id="stats"></section><div class="toolbar"><div class="actions"><button id="prev" aria-label="이전 기간">‹</button><h2 id="period"></h2><button id="next" aria-label="다음 기간">›</button><button id="today">오늘</button></div><label style="display:flex;align-items:center"><input type="checkbox" id="weekends">주말 표시</label></div>
<div class="filters" id="filters"><input id="search" placeholder="업무명·메모·업무구분 검색" aria-label="업무 검색"><select id="assignee" aria-label="담당자"><option value="">담당자 전체</option></select><select id="category" aria-label="업무구분"><option value="">업무구분 전체</option></select><select id="statusFilter" aria-label="상태"><option value="">상태 전체</option><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select><button id="reset">초기화</button><button id="export">CSV 내보내기</button></div><div id="content"></div></main></div>
<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal" id="taskForm"><h2 id="modalTitle">업무 추가</h2><div class="form"><label class="full">업무명<input id="title" required maxlength="500"></label><label>날짜<input type="date" id="date" required></label><label>일정 유형<select id="kind"><option>업무</option><option>휴가·출장</option></select></label><label>담당자<select id="person"></select></label><label>업무구분<input id="cat" list="categories" placeholder="예: 행사, N배송, 주간 회의"><datalist id="categories"></datalist></label><label>상태<select id="taskStatus"><option>예정</option><option>진행중</option><option>확인필요</option><option>완료</option></select></label><label>채널<input id="channel" list="channels"><datalist id="channels"><option>공통</option><option>네이버</option><option>쿠팡로켓</option><option>골프존</option><option>자사몰</option><option>SNS</option><option>오프라인</option></datalist></label><label class="full">메모<textarea id="note" maxlength="10000"></textarea></label></div><p id="formError" class="sub" role="alert"></p><footer><button type="button" id="delete">삭제</button><button type="button" id="cancel">취소</button><button class="primary" id="save">저장</button></footer></form></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let data={tasks:[],users:[],history:[]},view='month',cursor=new Date(),editing=null,busy=false,loaded=false;
function rpc(name,arg){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script){reject(new Error('공동 편집 서버 연결이 필요합니다. 배포된 Google 웹앱 주소에서 열어 주세요.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg);});}
function message(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error);}
function options(id,values,first){const current=$(id).value;$(id).innerHTML=(first?`<option value="">${first}</option>`:'')+values.map(v=>`<option>${esc(v)}</option>`).join('');if(values.includes(current))$(id).value=current;}
function updateOptions(){const people=[...new Set([...data.users.map(u=>u.name),...data.tasks.map(t=>t.assignee),'All','미지정'])];options('assignee',people,'담당자 전체');options('person',people);const cats=[...new Set(['일반','행사','주간 회의','N배송','가격점검','광고 관련','인수인계','연차','출장',...data.tasks.map(t=>t.category)])].sort();options('category',cats,'업무구분 전체');$('categories').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');}
async function refresh(silent=false){if(busy||$('modal').classList.contains('show'))return;try{if(!silent)message('공동 데이터를 불러오는 중…');data=await rpc('bootstrap');loaded=true;$('add').disabled=false;$('who').textContent=data.user;updateOptions();render();message('● 공동 저장 연결됨 · 마지막 동기화 '+new Date().toLocaleTimeString('ko-KR')+' · 15초마다 갱신');}catch(e){message(e.message||String(e),true);}}
function filtered(){const q=$('search').value.toLowerCase();return data.tasks.filter(t=>(!$('assignee').value||t.assignee===$('assignee').value)&&(!$('category').value||t.category===$('category').value)&&(!$('statusFilter').value||t.status===$('statusFilter').value)&&(!q||[t.title,t.note,t.category,t.channel].join(' ').toLowerCase().includes(q)));}
function monthTasks(){const prefix=iso(cursor).slice(0,7);return filtered().filter(t=>t.date.startsWith(prefix));}
function tile(t){return `<div class="task ${t.status==='완료'?'done':''} ${t.kind==='휴가·출장'?'leave':''} ${t.status==='확인필요'?'alert':''}"><input type="checkbox" aria-label="${esc(t.title)} 완료" data-check="${esc(t.id)}" ${t.status==='완료'?'checked':''} ${busy?'disabled':''}><button data-edit="${esc(t.id)}">${esc(t.title)}<small>${esc(t.assignee)} · ${esc(t.category)}${t.status==='진행중'?' · 진행중':''}</small></button></div>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const mt=monthTasks(),done=mt.filter(t=>t.status==='완료').length;$('stats').innerHTML=[['이번 달 업무',mt.length],['미완료',mt.length-done],['완료',done],['완료율',(mt.length?Math.round(done/mt.length*100):0)+'%']].map(([label,n])=>`<div class="stat">${label}<b>${n}</b></div>`).join('');
 $('filters').classList.toggle('hide',['settings','history'].includes(view));$('period').textContent=cursor.getFullYear()+'년 '+(cursor.getMonth()+1)+'월';
 if(view==='settings'){renderSettings();return;}if(view==='history'){ $('content').innerHTML='<div class="list">'+(data.history.map(h=>`<div class="row"><span>${esc(h[2])}</span><span>${esc(h[0])}</span><span>${esc(h[4])}</span><span>${esc(h[1])}</span></div>`).join('')||'<div class="empty">아직 변경 기록이 없습니다.</div>')+'</div>';return;}
 let list=filtered();if(view==='month'||view==='week'){const week=view==='week',start=new Date(cursor.getFullYear(),cursor.getMonth(),week?cursor.getDate():1);start.setDate(start.getDate()-((start.getDay()+6)%7));const days=week?7:42,weekends=$('weekends').checked;let html=`<div class="calendar-wrap"><div class="cal ${weekends?'weekend':''}">`+['월','화','수','목','금',...(weekends?['토','일']:[])].map(d=>`<div class="weekday">${d}</div>`).join('');if(week)$('period').textContent=iso(start)+' 주간';for(let i=0;i<days;i++){const d=new Date(start);d.setDate(d.getDate()+i);if(!weekends&&[0,6].includes(d.getDay()))continue;const date=iso(d);html+=`<div class="day ${d.getMonth()!==cursor.getMonth()?'outside':''} ${date===iso(new Date())?'today':''}"><div class="date"><span>${d.getMonth()+1}/${d.getDate()}</span><button data-add="${date}" aria-label="${date} 업무 추가" ${loaded?'':'disabled'}>+</button></div>${list.filter(t=>t.date===date).map(tile).join('')}</div>`;}html+='</div></div>';$('content').innerHTML=html;
 }else{list=list.filter(t=>t.date.startsWith(iso(cursor).slice(0,7))).filter(t=>view==='pending'?t.status!=='완료':view==='done'?t.status==='완료':t.kind==='휴가·출장').sort((a,b)=>a.date.localeCompare(b.date));$('content').innerHTML='<div class="list">'+(list.map(t=>`<div class="row"><input type="checkbox" data-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${t.status==='완료'?'checked':''}><span>${esc(t.date.slice(5))}</span><button data-edit="${esc(t.id)}">${esc(t.title)}</button><span>${esc(t.assignee)}</span><span class="optional">${esc(t.category)}</span><span class="badge optional">${esc(t.status)}</span></div>`).join('')||'<div class="empty">조건에 맞는 업무가 없습니다.</div>')+'</div>';}}
function openTask(id,date){editing=id?data.tasks.find(t=>t.id===id):null;const t=editing||{title:'',date:date||iso(new Date()),assignee:data.users.find(u=>u.email===data.user)?.name||'미지정',category:'일반',status:'예정',channel:'공통',note:'',kind:'업무'};for(const [field,key]of Object.entries({title:'title',date:'date',person:'assignee',cat:'category',taskStatus:'status',channel:'channel',note:'note',kind:'kind'}))$(field).value=t[key];$('modalTitle').textContent=editing?'업무 수정':'업무 추가';$('delete').classList.toggle('hide',!editing);$('formError').textContent='';$('modal').classList.add('show');$('title').focus();}
function closeTask(){if(busy)return;$('modal').classList.remove('show');editing=null;}
async function persist(t,close=false){if(busy)return;busy=true;$('save').disabled=true;$('delete').disabled=true;message('공동 저장 중…');try{const saved=await rpc('mutateTask',t);data.tasks=data.tasks.filter(x=>x.id!==saved.id);if(!saved.deleted)data.tasks.push(saved);if(close){$('modal').classList.remove('show');editing=null;}updateOptions();render();message('✓ 공동 저장 완료');}catch(e){message(e.message,true);$('formError').textContent=e.message;if(!close)awaitRefresh=true;}finally{busy=false;$('save').disabled=false;$('delete').disabled=false;render();}}
let awaitRefresh=false;
$('taskForm').onsubmit=e=>{e.preventDefault();persist({...editing,title:$('title').value,date:$('date').value,assignee:$('person').value,category:$('cat').value||'일반',status:$('taskStatus').value,channel:$('channel').value||'공통',note:$('note').value,kind:$('kind').value},true);};$('delete').onclick=()=>{if(editing&&confirm('이 업무를 삭제할까요? 변경 이력은 남습니다.'))persist({...editing,deleted:true},true);};$('cancel').onclick=closeTask;$('modal').onclick=e=>{if(e.target===$('modal'))closeTask();};document.onkeydown=e=>{if(e.key==='Escape')closeTask();};$('add').onclick=()=>openTask();$('refresh').onclick=()=>refresh();$('nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render();}};$('content').onclick=e=>{const b=e.target.closest('[data-add],[data-edit]');if(b){if(b.dataset.add)openTask(null,b.dataset.add);else openTask(b.dataset.edit);}};$('content').onchange=e=>{const id=e.target.dataset.check;if(id){const t=data.tasks.find(t=>t.id===id);persist({...t,status:e.target.checked?'완료':'예정'});}};
['search','assignee','category','statusFilter','weekends'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=()=>{['search','assignee','category','statusFilter'].forEach(id=>$(id).value='');render();};function move(n){if(view==='week')cursor.setDate(cursor.getDate()+7*n);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render();}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{cursor=new Date();render();};
$('export').onclick=()=>{const safe=s=>'"'+String(s??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['날짜','담당자','업무구분','업무명','상태','채널','메모'],...monthTasks().map(t=>[t.date,t.assignee,t.category,t.title,t.status,t.channel,t.note])];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='R2G-'+iso(cursor).slice(0,7)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function renderSettings(){$('content').innerHTML=`<section class="settings"><h2>팀 설정</h2><p class="sub">Google 계정으로 로그인한 네 명이 같은 데이터를 수정합니다.</p>${data.admin?`<form id="members">${Array.from({length:4},(_,i)=>`<div class="member"><input name="name${i}" aria-label="팀원 ${i+1} 이름" placeholder="이름" required value="${esc(data.users[i]?.name||'')}"><input type="email" name="email${i}" aria-label="팀원 ${i+1} 이메일" placeholder="Google 이메일" required value="${esc(data.users[i]?.email||'')}"></div>`).join('')}<button class="primary">네 명 저장 및 접근 권한 설정</button></form>`:data.users.map(u=>`<p>${esc(u.name)} · ${esc(u.email)}</p>`).join('')}<hr><p class="sub">저장 방식: Google 공동 데이터 · 변경 충돌 감지 · 자동 새로고침 15초</p><p><a href="${esc(data.dbUrl||'#')}" target="_blank" rel="noopener">공동 데이터 시트 열기</a></p><p><a href="https://docs.google.com/spreadsheets/d/1XWIJSEfbhZ6SpqNp0S383c8lSvgHKvUi65aS_ndEoMI/edit" target="_blank" rel="noopener">기존 업무 시트 열기</a></p><p class="sub">기존 시트는 초기 이관 자료입니다. 이후 앱의 수정 내용은 공동 데이터에 저장됩니다.</p></section>`;if(data.admin)$('members').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),users=Array.from({length:4},(_,i)=>({name:f.get('name'+i),email:f.get('email'+i)}));try{message('팀 접근 권한 설정 중…');await rpc('saveMembers',users);await refresh();}catch(err){message(err.message,true);}};}
render();refresh();setInterval(()=>{if(loaded&&!busy&&!document.hidden&&!$('modal').classList.contains('show'))refresh(true);},15000);
</script></html>
